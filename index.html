<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="V³ Studio" />
<meta name="theme-color" content="#0c0c0c" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preload" href="ink.mp4" as="video" type="video/mp4" />
<link rel="preload" href="logo.png" as="image" />
<title>V³ studio</title>
<meta http-equiv="Cache-Control" content="no-cache" />
<style>
  :root { --ink:#141414; --line:rgba(20,20,20,.4); --paper:#f6f6f4; --white:#f3f3f1; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; background:var(--paper); color:var(--ink); font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; touch-action:manipulation; }
  body.dark { --ink:#f3f3f1; --line:rgba(243,243,241,.32); --paper:#0c0c0c; background:#0c0c0c; color:#f3f3f1; }
  body.dark .logo { filter:invert(1); }
  button, a, input, textarea { font-family:inherit; color:inherit; }

  .scene { position:fixed; inset:0; display:none; height:100dvh; padding:env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px); }
  .scene.on { display:flex; z-index:8; align-items:center; justify-content:center; }

  .cross { position:fixed; inset:0; pointer-events:none; z-index:5; transition:opacity .4s; }
  .cross.off { opacity:0; }
  .cross i { position:absolute; background:var(--line); pointer-events:none; transition:left .75s cubic-bezier(.2,.8,.2,1), top .75s cubic-bezier(.2,.8,.2,1); }
  .cross .v { top:0; bottom:0; width:1px; left:50%; }
  .cross .h { left:0; right:0; height:1px; top:50%; }

  .frame { position:fixed; inset:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); border:1px solid var(--line); pointer-events:none; z-index:4; transition:opacity .6s; }
  .frame.off { opacity:0; }

  /* Wireframe Globe */
  .globe-wrap { position:fixed; top:48%; right:-110px; width:84px; height:84px; z-index:5; pointer-events:none; opacity:0; }
  .globe-wrap.on { opacity:.75; animation:rollGlobe 9s linear 1 forwards; }
  @keyframes rollGlobe {
    0% { transform:translateX(0) rotate(0deg); }
    100% { transform:translateX(-140vw) rotate(-720deg); }
  }
  .globe-svg { width:100%; height:100%; stroke:var(--ink); fill:none; stroke-width:1; }
  body.dark .globe-svg { stroke:var(--white); }

  #home, #after, #how { align-items:center; justify-content:center; flex-direction:column; }
  .mark { position:relative; width:min(230px, 62vw); height:min(250px, 38vh); display:grid; place-items:center; }
  .logo { height:min(200px, 34vh); width:auto; }

  .btn { position:relative; z-index:2; overflow:hidden; margin-top:24px; border:1px solid currentColor; border-radius:30px; background:transparent; padding:12px 28px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; opacity:0; transform:translateY(14px); transition:opacity .6s, transform .6s, background .3s; }
  .btn.show { opacity:1; transform:none; }
  .btn:active { background:rgba(255,255,255,.1); }
  .btn .glint { position:absolute; top:0; left:-120%; width:80%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); transform:skewX(-20deg); }
  .btn.glint .glint { animation:shine 2.4s ease-in-out infinite; }
  @keyframes shine { to { left:180%; } }

  /* Film Scene */
  #film { padding:0; background:#000; }
  #vid { width:100%; height:100%; object-fit:cover; display:block; }
  .shade { position:absolute; inset:0; background:radial-gradient(circle, transparent 40%, rgba(0,0,0,.65) 100%); pointer-events:none; }
  #film .cross { position:absolute; inset:0; z-index:3; pointer-events:none; }
  #film .cross i { background:rgba(255,255,255,.55); }
  
  .skip-btn { position:absolute; top:max(20px, env(safe-area-inset-top)); right:20px; z-index:10; border:1px solid rgba(255,255,255,.2); border-radius:20px; background:rgba(0,0,0,.22); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); color:rgba(255,255,255,.7); font-size:10px; letter-spacing:.18em; text-transform:uppercase; padding:6px 14px; cursor:pointer; transition:.3s; }
  .skip-btn:active { background:rgba(255,255,255,.18); color:#fff; }

  .cap { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 24px; opacity:0; transition:opacity .4s; pointer-events:none; }
  .cap.on { opacity:1; }
  #phrase { font-size:clamp(22px, 6vw, 36px); letter-spacing:.06em; line-height:1.35; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.9); display:inline-block; }

  /* After / Cipher */
  .cipher { max-width:18em; padding:0 24px; text-align:center; font-size:clamp(16px, 4.2vw, 26px); line-height:1.45; letter-spacing:.08em; min-height:3em; }

  /* How Scene & Canvas Cosmic Spiral Vortex */
  #how { position:relative; overflow:hidden; }
  #how .steps { width:100%; max-width:320px; display:flex; flex-direction:column; gap:18px; text-align:center; z-index:3; }
  #how .steps p { margin:0; font-size:18px; letter-spacing:.2em; text-transform:uppercase; opacity:0; transform:translateY(24px); transition:opacity .6s, transform .6s; }
  #how .steps p.in { opacity:1; transform:none; }
  
  .vortex-canvas-box { width:min(320px, 85vw); height:160px; margin-top:16px; z-index:2; opacity:0; transition:opacity .8s; background:transparent; overflow:hidden; pointer-events:none; position:relative; }
  .vortex-canvas-box.on { opacity:.9; }
  #vortexCanvas { width:100%; height:100%; display:block; background:transparent; }

  /* Gallery */
  #gallery { background:#0c0c0c; color:#f3f3f1; display:none; flex-direction:column; padding:env(safe-area-inset-top, 16px) 0 env(safe-area-inset-bottom, 16px); }
  #gallery.on { display:flex; }
  .gtop { padding:16px 20px 0; text-align:center; letter-spacing:.18em; font-size:11px; text-transform:uppercase; color:#888; }
  .rail { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:18px 16vw 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .rail::-webkit-scrollbar { display:none; }
  .card { flex:0 0 65vw; max-width:320px; scroll-snap-align:center; opacity:.45; transform:scale(.92); transition:.4s; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,.15); }
  .card.focus { opacity:1; transform:none; border-color:rgba(255,255,255,.4); }
  .card img { width:100%; height:38vh; min-height:220px; object-fit:cover; display:block; }
  
  .note { width:min(520px, calc(100% - 40px)); margin:6px auto 0; padding:12px 16px; border:1px solid rgba(255,255,255,.12); border-radius:14px; background:rgba(255,255,255,.03); }
  .note-top { display:flex; justify-content:space-between; align-items:center; }
  .note-top h2 { font-size:16px; letter-spacing:.1em; text-transform:uppercase; font-weight:500; }
  .note-actions { display:flex; gap:10px; align-items:center; }
  .btn-detail { border:1px solid rgba(255,255,255,.3); border-radius:16px; background:transparent; font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:5px 12px; cursor:pointer; }
  .btn-detail:active { background:rgba(255,255,255,.15); }
  .x { border:0; background:transparent; font-size:22px; cursor:pointer; width:30px; height:30px; display:grid; place-items:center; color:#fff; }
  .full { max-height:0; overflow:hidden; color:#a0a0a0; font-size:12px; line-height:1.5; transition:max-height .4s ease, margin .3s; }
  .full.open { max-height:140px; margin-top:10px; }
  .discuss { margin:14px auto 10px; }

  /* Project Modal */
  .modal { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:20px; }
  .modal.on { display:flex; }
  .modal-box { width:min(500px, 100%); max-height:85vh; background:#141414; border:1px solid rgba(255,255,255,.2); border-radius:20px; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:16px; position:relative; }
  .modal-close { position:absolute; top:16px; right:16px; border:0; background:transparent; font-size:24px; color:#aaa; cursor:pointer; }
  .modal-title { font-size:18px; letter-spacing:.12em; text-transform:uppercase; margin-right:30px; }
  .modal-link { color:#6bb6ff; font-size:12px; text-decoration:none; word-break:break-all; }
  .modal-gallery { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .modal-gallery img { height:110px; width:150px; object-fit:cover; border-radius:8px; border:1px solid rgba(255,255,255,.15); flex:0 0 auto; }
  .modal-desc { font-size:13px; color:#ccc; line-height:1.55; }
  .modal-free { font-size:12px; color:#888; border-top:1px dashed rgba(255,255,255,.15); padding-top:12px; }

  /* Shell Scene & Dock */
  #shell { background:#0c0c0c; color:#f3f3f1; display:none; flex-direction:column; padding:0 0 84px; }
  #shell.on { display:flex; }
  .ticker { overflow:hidden; border-bottom:1px solid rgba(243,243,241,.15); flex:0 0 auto; }
  .ticker-track { display:flex; gap:26px; width:max-content; animation:marquee 28s linear infinite; padding:10px 0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  @keyframes marquee { to { transform:translateX(-50%); } }
  .ticker a { color:inherit; text-decoration:none; }
  
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:10px 14px; width:100%; }
  .panel { width:100%; height:calc(100dvh - 170px); border:1px solid rgba(243,243,241,.28); border-radius:20px; display:flex; flex-direction:column; overflow:hidden; background:rgba(255,255,255,.02); position:relative; }
  .panel h2 { margin:0; padding:14px 16px 8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:400; color:#888; border-bottom:1px solid rgba(243,243,241,.1); flex:0 0 auto; }

  /* Studio Tab Layout */
  .studio-layout { display:flex; flex:1; width:100%; height:100%; overflow:hidden; }
  .studio-sidebar { width:125px; display:flex; flex-direction:column; gap:10px; padding:14px 10px; border-right:1px solid rgba(255,255,255,.1); flex:0 0 auto; }
  .studio-sidebar button { border:1px solid currentColor; border-radius:24px; background:transparent; height:34px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; text-align:center; width:100%; transition:.3s; }
  .studio-sidebar button.active { background:rgba(255,255,255,.15); border-color:#fff; color:#fff; }
  
  .studio-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding:12px; overflow-y:auto; }
  
  /* Perfect 3D Cube (Transparent faces, 100px square, strictly centered) */
  .cube-stage { perspective:900px; display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none; user-select:none; width:100%; height:100%; cursor:grab; }
  .cube-stage:active { cursor:grabbing; }
  .cube3 { width:100px; height:100px; position:relative; transform-style:preserve-3d; transition:transform 0.04s ease-out; }
  .cube3 i { position:absolute; width:100px; height:100px; inset:0; border:1px solid rgba(255,255,255,.8); background:transparent; pointer-events:none; }
  .cube3 i:nth-child(1){ transform:rotateY(0deg) translateZ(50px); }
  .cube3 i:nth-child(2){ transform:rotateY(180deg) translateZ(50px); }
  .cube3 i:nth-child(3){ transform:rotateY(90deg) translateZ(50px); }
  .cube3 i:nth-child(4){ transform:rotateY(-90deg) translateZ(50px); }
  .cube3 i:nth-child(5){ transform:rotateX(90deg) translateZ(50px); }
  .cube3 i:nth-child(6){ transform:rotateX(-90deg) translateZ(50px); }
  .touch-hint { margin-top:28px; font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#999; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  /* Morphing Design Effect Scene */
  .morph-wrap { width:100%; height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden; border-radius:12px; transition:all .5s cubic-bezier(.2,.8,.2,1); }
  .morph-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid currentColor; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  .morph-hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px 12px; gap:12px; position:relative; }
  .morph-title { font-size:clamp(16px, 4.5vw, 22px); letter-spacing:.08em; text-transform:uppercase; font-weight:700; line-height:1.25; }
  .morph-desc { font-size:11px; max-width:240px; opacity:.85; line-height:1.4; }
  .morph-cards { display:flex; gap:8px; width:100%; padding:0 8px 10px; }
  .morph-card { flex:1; padding:8px; border:1px solid currentColor; border-radius:6px; font-size:9px; text-align:center; }
  .morph-btn-trigger { position:absolute; z-index:10; top:50%; left:50%; transform:translate(-50%, -50%); border:2px solid currentColor; border-radius:30px; font-weight:700; font-size:12px; letter-spacing:.18em; text-transform:uppercase; padding:12px 24px; cursor:pointer; box-shadow:0 6px 24px rgba(0,0,0,.6); transition:.2s; }
  .morph-btn-trigger:active { transform:translate(-50%, -50%) scale(.93); }
  
  /* Morphing Theme Presets */
  .theme-auto { background:#0a0a0a; color:#ff3b30; font-family:"Impact", "Arial Black", sans-serif; }
  .theme-auto .morph-card { background:#141414; border-color:#ff3b30; color:#fff; }
  .theme-auto .morph-btn-trigger { background:#ff3b30; color:#000; border-color:#fff; }

  .theme-dolls { background:#fff0f5; color:#d63384; font-family:"Comic Sans MS", "Chalkboard SE", cursive, sans-serif; border-radius:24px; }
  .theme-dolls .morph-header { border-bottom:2px dashed #ff69b4; }
  .theme-dolls .morph-card { background:#ffffff; border:2px solid #ffb6c1; border-radius:16px; color:#c71585; }
  .theme-dolls .morph-btn-trigger { background:#ff69b4; color:#fff; border-color:#fff; border-radius:24px; }

  .theme-space { background:#020617; color:#38bdf8; font-family:"Courier New", monospace; text-shadow:0 0 8px rgba(56,189,248,.6); }
  .theme-space .morph-card { background:#0f172a; border-color:#0284c7; color:#e0f2fe; }
  .theme-space .morph-btn-trigger { background:#0369a1; color:#fff; border-color:#38bdf8; }

  .theme-yoga { background:#f4f1ea; color:#3f4e4f; font-family:Georgia, serif; }
  .theme-yoga .morph-header { border-bottom:1px solid #a27b5c; }
  .theme-yoga .morph-card { background:#dcd7c9; border:none; border-radius:8px; color:#2c3639; }
  .theme-yoga .morph-btn-trigger { background:#2c3639; color:#f4f1ea; border-color:#a27b5c; border-radius:4px; font-family:Georgia, serif; }

  /* Team list view */
  .team-list { width:100%; display:flex; flex-direction:column; gap:12px; padding:6px; }
  .team-card { display:flex; gap:12px; align-items:flex-start; border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px; background:rgba(255,255,255,.02); }
  .team-avatar { width:48px; height:48px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.25); flex:0 0 auto; }
  .team-info { flex:1; }
  .team-header { display:flex; justify-content:space-between; align-items:center; }
  .team-name { font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; }
  .team-role { font-size:11px; color:#888; margin-top:2px; }
  .team-bio { max-height:0; overflow:hidden; color:#a0a0a0; font-size:11.5px; line-height:1.45; transition:max-height .3s ease, margin .3s; }
  .team-bio.open { max-height:120px; margin-top:6px; }
  .team-expand { border:0; background:transparent; font-size:18px; cursor:pointer; color:#aaa; width:24px; height:24px; display:grid; place-items:center; }

  /* Fixed Dock */
  .dock { position:fixed; left:12px; right:12px; bottom:12px; z-index:9; height:50px; border:1px solid rgba(243,243,241,.28); border-radius:25px; background:rgba(12,12,12,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); opacity:0; transform:translateY(12px); pointer-events:none; transition:.4s ease; display:flex; padding:4px; }
  .dock.on { opacity:1; transform:none; pointer-events:auto; }
  .dock i#pill { position:absolute; top:4px; bottom:4px; width:calc((100% - 8px) / 4); left:4px; border-radius:20px; background:rgba(243,243,241,.18); transition:transform .3s cubic-bezier(.2,.8,.2,1); pointer-events:none; }
  .dock button { flex:1; position:relative; z-index:1; border:0; background:transparent; color:#8d8d8d; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  .dock button.on { color:#fff; }

  /* Admin form & panel elements */
  .log { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:92%; padding:10px 12px; font-size:12px; line-height:1.45; border:1px solid rgba(243,243,241,.18); border-radius:12px; background:rgba(255,255,255,.03); }
  .bubble.you { align-self:flex-end; background:rgba(243,243,241,.12); }
  .bubble.admin-badge { border-color:#4ade80; color:#4ade80; font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  
  .auth-box { display:flex; flex-direction:column; gap:10px; padding:14px; overflow-y:auto; flex:1; }
  .admin-input { width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.2); border-radius:10px; color:#fff; font-size:12px; padding:8px 10px; outline:none; }
  .admin-input:focus { border-color:#fff; }
  .admin-btn { border:1px solid currentColor; border-radius:18px; background:transparent; height:34px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  .admin-btn:active { background:rgba(255,255,255,.15); }
  
  form#form { display:flex; gap:8px; padding:10px 12px; border-top:1px solid rgba(243,243,241,.12); }
  form#form input { flex:1; background:transparent; border:0; color:inherit; font-size:13px; padding:6px 0; outline:none; }
  form#form button { border:0; background:transparent; cursor:pointer; width:32px; height:32px; padding:0; display:grid; place-items:center; }

  /* Studio sidebar scroll */
  .studio-sidebar { overflow-y:auto; width:118px; }
  .studio-sidebar button { flex:0 0 auto; }
  .studio-content.top { justify-content:flex-start; align-items:stretch; }

  /* Cube light trail */
  .cube-stage { position:relative; }
  .trail-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }

  /* Projects grid in About */
  .proj-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
  .proj-tile { position:relative; border:1px solid rgba(255,255,255,.18); border-radius:12px; overflow:hidden; cursor:pointer; background:#111; padding:0; }
  .proj-tile img { width:100%; height:110px; object-fit:cover; display:block; }
  .proj-tile span { display:block; padding:7px 8px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; text-align:left; color:#eee; }

  /* Contact card */
  .ccard { width:100%; max-width:340px; margin:auto; border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:20px 18px; background:linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.015)); position:relative; overflow:hidden; }
  .ccard::after { content:""; position:absolute; right:-60px; top:-60px; width:160px; height:160px; border-radius:50%; border:1px solid rgba(255,255,255,.18); box-shadow:0 0 0 24px rgba(255,255,255,.03), 0 0 0 48px rgba(255,255,255,.02); }
  .ccard-logo { height:46px; filter:invert(1); display:block; margin-bottom:14px; }
  .ccard h3 { font-size:13px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:14px; font-weight:500; }
  .crow { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid rgba(255,255,255,.12); text-decoration:none; color:#f3f3f1; font-size:12.5px; line-height:1.35; position:relative; z-index:1; }
  .crow svg { flex:0 0 22px; width:22px; height:22px; stroke:#f3f3f1; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .crow small { display:block; font-size:9px; letter-spacing:.18em; color:#888; text-transform:uppercase; margin-bottom:2px; }

  /* Tariffs */
  .svc-list { flex:1; overflow-y:auto; padding:8px 12px; -webkit-overflow-scrolling:touch; }
  .svc { border:1px solid rgba(243,243,241,.16); border-radius:14px; margin-bottom:8px; background:rgba(255,255,255,.02); }
  .svc-top { display:flex; align-items:center; gap:8px; padding:11px 10px 11px 14px; }
  .svc-name { flex:1; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; }
  .svc-price { font-size:10px; color:#888; white-space:nowrap; }
  .svc-x { flex:0 0 30px; width:30px; height:30px; border:1px solid rgba(255,255,255,.3); border-radius:50%; background:transparent; font-size:20px; line-height:1; cursor:pointer; display:grid; place-items:center; transition:transform .3s, background .3s; color:#fff; }
  .svc.open .svc-x { transform:rotate(45deg); background:rgba(255,255,255,.14); }
  .svc-body { max-height:0; overflow:hidden; transition:max-height .4s ease; }
  .svc.open .svc-body { max-height:600px; }
  .svc-inner { padding:0 14px 14px; display:flex; flex-direction:column; gap:10px; }
  .svc-desc { font-size:12px; line-height:1.55; color:#b5b5b5; }

// Ultra-smooth 60fps Canvas Cosmic Vortex (Black/White Particle Galaxy)
let vortexAnimId = null;
const canvas = document.getElementById('vortexCanvas');
const ctx = canvas.getContext('2d', { alpha:true });
let particles = [];

function initParticles() {
  particles = [];
  const count = 160;
  for (let i = 0; i < count; i++) {
    particles.push({
      angle: Math.random() * Math.PI * 2,
      radius: 12 + Math.random() * 110,
      speed: 0.015 + Math.random() * 0.025,
      size: 0.8 + Math.random() * 1.8,
      opacity: 0.3 + Math.random() * 0.7
    });
  }
}

function startVortexCanvas() {
  const rect = vortexBox.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
  initParticles();
  
  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    
    const cx = w / 2;
    const cy = h / 2;
    
    // central glow (transparent background, no black plate)
    const dprr = (window.devicePixelRatio || 1);
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, 26 * dprr);
    const gc = document.body.classList.contains('dark') ? '255,255,255' : '20,20,20';
    gr.addColorStop(0, 'rgba(' + gc + ',0.3)');
    gr.addColorStop(1, 'rgba(' + gc + ',0)');
    ctx.beginPath();
    ctx.arc(cx, cy, 26 * dprr, 0, Math.PI * 2);
    ctx.fillStyle = gr;
    ctx.fill();
    
    particles.forEach(p => {
      p.angle += p.speed;
      p.radius -= 0.18;
      if (p.radius < 8) {
        p.radius = 110 + Math.random() * 20;
        p.angle = Math.random() * Math.PI * 2;
      }
      // 3D perspective flattened ellipse
      const x = cx + Math.cos(p.angle) * p.radius * (window.devicePixelRatio || 1);
      const y = cy + Math.sin(p.angle) * (p.radius * 0.42) * (window.devicePixelRatio || 1);
      
      ctx.beginPath();
      ctx.arc(x, y, p.size * (window.devicePixelRatio || 1), 0, Math.PI * 2);
      ctx.fillStyle = (document.body.classList.contains('dark') ? 'rgba(245,245,245,' : 'rgba(20,20,20,') + p.opacity + ')';
      ctx.fill();
    });
    
    vortexAnimId = requestAnimationFrame(draw);
  }
  if (!vortexAnimId) draw();
}

function stopVortexCanvas() {
  if (vortexAnimId) {
    cancelAnimationFrame(vortexAnimId);
    vortexAnimId = null;
  }
}

// After Cipher Animation
function cipher() {
  const phraseText = 'создание дизайна и решений для проектов';
  const box = document.getElementById('cipher');
  const chars = phraseText.split('');
  const glyphs = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ';
  const open = chars.map(c => c === ' ');
  const draw = () => {
    box.textContent = chars.map((c,i) => c === ' ' || open[i] ? c : glyphs[Math.floor(Math.random()*glyphs.length)]).join('');
  };
  draw();
  const timer = setInterval(() => {
    const closed = open.map((v,i) => !v && chars[i] !== ' ' ? i : -1).filter(i => i >= 0);
    if (!closed.length) {
      clearInterval(timer);
      box.textContent = phraseText;
      document.getElementById('howBtn').classList.add('show');
      return;
    }
    open[closed[Math.floor(Math.random()*closed.length)]] = true;
    draw();
  }, 36);
}

function buildRail() {
  const rail = document.getElementById('rail');

    d.className = 'card' + (i === currentProjectIndex ? ' focus' : '');

    d.dataset.index = i;
    rail.appendChild(d);
  });
  updateCardInfo(currentProjectIndex);
  
  rail.onscroll = () => {
    const cards = [...rail.children];
    const mid = rail.scrollLeft + rail.clientWidth / 2;
    let best = 0, dist = 1e9;
    cards.forEach((c, i) => {
      const dd = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
      if (dd < dist) { dist = dd; best = i; }
    });
    cards.forEach((c, i) => c.classList.toggle('focus', i === best));
    currentProjectIndex = best;
    updateCardInfo(best);
  };
}

function fxFill(t) {
  fxo.className = 'fxo on vis ' + t.cls;
  document.getElementById('fxLogo').textContent = t.logo;
  document.getElementById('fxNav').innerHTML = t.nav;
  document.getElementById('fxEye').textContent = t.eye;
  document.getElementById('fxTitle').innerHTML = t.title;
  document.getElementById('fxDesc').textContent = t.desc;
  document.getElementById('fxCta').textContent = t.cta;
  document.getElementById('fxArtT').textContent = t.art;
  document.getElementById('fxFoot').textContent = t.foot;
  document.getElementById('fxCards').innerHTML = t.cards.map(c => '<div class="fx-card"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('');
  document.querySelectorAll('#fxDots i').forEach((d,i) => d.classList.toggle('on', i === fxStep));
  fxBtn.textContent = fxStep === fxThemes.length - 1 ? 'ВЕРНУТЬСЯ' : 'НАЖМИ';
}
function openFx() {
  fxStep = 0;
  fxo.classList.add('on');
  fxFill(fxThemes[0]);
  fxo.classList.remove('vis');
  requestAnimationFrame(() => requestAnimationFrame(() => fxo.classList.add('vis')));
}
function closeFx() {
  fxo.classList.remove('vis');
  setTimeout(() => fxo.classList.remove('on'), 520);
  const b = document.querySelector('.capabilities-tabs button[data-view="aes"]') || document.querySelector('.studio-sidebar button[data-view="aes"]');
  if (b) b.click();
}
fxBtn.onclick = () => {
  if (fxBusy) return;
  if (fxStep >= fxThemes.length - 1) { closeFx(); return; }
  fxBusy = true;
  fxSite.classList.add('swap');
  fxStep++;
  const next = fxThemes[fxStep];
  fxo.classList.remove(...fxThemes.map(t => t.cls));
  fxo.classList.add(next.cls);
  setTimeout(() => {
    fxFill(next);
    fxSite.classList.remove('swap');
    fxBusy = false;
  }, 300);
};

// ===== Scratch card "Креатив" =====
const scr = document.getElementById('scr');
const scrCanvas = document.getElementById('scrCanvas');
const scrHint = document.getElementById('scrHint');
let scrCtx = null, scrDown = false, scrLast = null, scrDone = false, scrTimer = null;
function openScratch() {
  scr.classList.add('on');
  scr.classList.remove('vis');
  requestAnimationFrame(() => requestAnimationFrame(() => scr.classList.add('vis')));
  const w = window.innerWidth, h = window.innerHeight;
  scrCanvas.width = w; scrCanvas.height = h;
  scrCanvas.classList.remove('gone');
  scrCtx = scrCanvas.getContext('2d', { willReadFrequently:true });
  scrCtx.globalCompositeOperation = 'source-over';
  scrCtx.fillStyle = '#000';
  scrCtx.fillRect(0, 0, w, h);
  scrHint.style.opacity = 1;
  scrDone = false;
  clearInterval(scrTimer);
  scrTimer = setInterval(scrCheck, 350);
}
function closeScratch() {
  clearInterval(scrTimer);
  scr.classList.remove('vis');
  setTimeout(() => scr.classList.remove('on'), 420);
}
function scrStamp(x, y) {
  const r = 46;
  const g = scrCtx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,0.30)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.18)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  scrCtx.globalCompositeOperation = 'destination-out';
  scrCtx.fillStyle = g;
  scrCtx.beginPath(); scrCtx.arc(x, y, r, 0, Math.PI * 2); scrCtx.fill();
}
function scrMove(x, y) {
  if (scrDone) return;
  if (scrLast) {
    const dx = x - scrLast.x, dy = y - scrLast.y;
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(dist / 7));
    for (let i = 1; i <= steps; i++) scrStamp(scrLast.x + dx * i / steps, scrLast.y + dy * i / steps);
  } else scrStamp(x, y);
  scrLast = { x, y };
  scrHint.style.opacity = 0;
}
function scrCheck() {
  if (scrDone || !scrCtx) return;
  const w = scrCanvas.width, h = scrCanvas.height;
  const d = scrCtx.getImageData(0, 0, w, h).data;
  let clear = 0, total = 0;
  for (let i = 3; i < d.length; i += 4 * 40) { total++; if (d[i] < 90) clear++; }
  if (clear / total > 0.55) {
    scrDone = true;
    scrCanvas.classList.add('gone');
  }
}
scrCanvas.addEventListener('pointerdown', e => { scrDown = true; scrLast = null; scrCanvas.setPointerCapture(e.pointerId); scrMove(e.clientX, e.clientY); });
scrCanvas.addEventListener('pointermove', e => { if (scrDown) scrMove(e.clientX, e.clientY); });
const scrUp = () => { scrDown = false; scrLast = null; };
scrCanvas.addEventListener('pointerup', scrUp);
scrCanvas.addEventListener('pointercancel', scrUp);
document.getElementById('scrClose').onclick = closeScratch;


function setupCubeInteraction() {
  const content = document.getElementById('capabilitiesContent') || document.getElementById('studioContent');
  const stage = content && content.querySelector('.cube-stage');
  const cube = stage && stage.querySelector('.cube3');
  if (!stage || !cube) return;

  // light trail canvas
  const tc = document.createElement('canvas');
  tc.className = 'trail-canvas';
  stage.appendChild(tc);
  const dpr = window.devicePixelRatio || 1;
  const sr = stage.getBoundingClientRect();
  tc.width = sr.width * dpr; tc.height = sr.height * dpr;
  const tctx = tc.getContext('2d');
  const pts = [];
  const LIFE = 650;

  function drawTrail() {
    if (!document.body.contains(tc)) return;
    const now = performance.now();
    while (pts.length && now - pts[0].t > LIFE) pts.shift();
    tctx.clearRect(0, 0, tc.width, tc.height);
    tctx.lineCap = 'round'; tctx.lineJoin = 'round';
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const k = 1 - (now - b.t) / LIFE;
      if (k <= 0) continue;
      tctx.strokeStyle = 'rgba(190,235,255,' + (0.85 * k) + ')';
      tctx.shadowColor = 'rgba(120,200,255,' + k + ')';
      tctx.shadowBlur = 16 * dpr * k;
      tctx.lineWidth = (1 + 5 * k) * dpr;
      tctx.beginPath();
      tctx.moveTo(a.x * dpr, a.y * dpr);
      tctx.lineTo(b.x * dpr, b.y * dpr);
      tctx.stroke();
    }
    requestAnimationFrame(drawTrail);
  }
  requestAnimationFrame(drawTrail);

  let isDown = false;
  let startX, startY;
  function updateCube() { cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`; }
  updateCube();

  stage.addEventListener('pointerdown', (e) => {
    isDown = true; startX = e.clientX; startY = e.clientY;
    stage.setPointerCapture(e.pointerId);
    const r = stage.getBoundingClientRect();
    pts.push({ x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() });
  });
  stage.addEventListener('pointermove', (e) => {
    if (!isDown) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    rotY += dx * 0.7; rotX -= dy * 0.7;
    startX = e.clientX; startY = e.clientY;
    updateCube();
    const r = stage.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const last = pts[pts.length - 1];
    if (last && Math.hypot(px - last.x, py - last.y) > 3) {
      const n = Math.ceil(Math.hypot(px - last.x, py - last.y) / 4);
      for (let i = 1; i <= n; i++) pts.push({ x: last.x + (px - last.x) * i / n, y: last.y + (py - last.y) * i / n, t: performance.now() });
    } else if (!last) pts.push({ x: px, y: py, t: performance.now() });
  });
  function endDrag() { isDown = false; }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
}

function renderPrices() {
  services = getServices();
  cart = cart.filter(id => services.some(s => s.id === id));
  const list = document.getElementById('svcList');
  if (!list) return;
  list.innerHTML = services.map(sv => {
    const open = openSvc.has(sv.id), inCart = cart.includes(sv.id);
    let body;
    if (isAdmin) {
      body = `<div class="svc-inner">
        <input class="admin-input" data-f="title" value="${esc(sv.title)}" placeholder="Название">
        <textarea class="admin-input" data-f="desc" rows="4" placeholder="Описание">${esc(sv.desc)}</textarea>
        <input class="admin-input" data-f="price" type="number" inputmode="numeric" value="${esc(sv.price)}" placeholder="Цена, ₽ (пусто = по запросу)">
        <div style="display:flex;gap:8px">
          <button type="button" class="admin-btn" style="flex:1" data-act="save" data-id="${sv.id}">Сохранить</button>
          <button type="button" class="admin-btn" style="width:90px;color:#ef4444" data-act="del" data-id="${sv.id}">Удалить</button>
        </div></div>`;
    } else {
      body = `<div class="svc-inner"><div class="svc-desc">${esc(sv.desc)}</div>
        <button type="button" class="svc-add ${inCart ? 'in' : ''}" data-act="add" data-id="${sv.id}">${inCart ? '✓ в корзине' : 'добавить'}</button></div>`;
    }
    return `<div class="svc ${open ? 'open' : ''}" data-id="${sv.id}">
      <div class="svc-top"><span class="svc-name">${esc(sv.title)}</span><span class="svc-price">${fmtPrice(sv.price)}</span>
      <button type="button" class="svc-x" data-act="toggle" data-id="${sv.id}" aria-label="подробнее">+</button></div>
      <div class="svc-body">${body}</div></div>`;
  }).join('') + (isAdmin ? '<button type="button" class="admin-btn svc-add-new" data-act="new">+ новая опция</button>' : '');

  list.onclick = (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, id = +b.dataset.id;
    if (act === 'toggle') {
      openSvc.has(id) ? openSvc.delete(id) : openSvc.add(id);
      b.closest('.svc').classList.toggle('open');
    } else if (act === 'add') {
      cart.includes(id) ? cart = cart.filter(x => x !== id) : cart.push(id);
      saveCart(); renderPrices(); 
    } else if (act === 'save') {
      const card = b.closest('.svc');
      const sv = services.find(x => x.id === id);
      sv.title = card.querySelector('[data-f=title]').value;
      sv.desc = card.querySelector('[data-f=desc]').value;
      sv.price = card.querySelector('[data-f=price]').value;
      saveServices(services); renderPrices();
    } else if (act === 'del') {
      services = services.filter(x => x.id !== id);
      saveServices(services); renderPrices();
    } else if (act === 'new') {
      const nid = Math.max(0, ...services.map(x => x.id)) + 1;
      services.push({ id:nid, title:'Новая опция', price:'', desc:'Описание' });
      openSvc.add(nid); saveServices(services); renderPrices();
      list.scrollTop = list.scrollHeight;
    }
  };
  renderCartBar();
}

function renderCartBar() {
  const w = document.getElementById('cartWrap');
  if (!w) return;
  const items = cart.map(id => services.find(s => s.id === id)).filter(Boolean);
  const total = items.reduce((a, s) => a + (isNaN(+s.price) || s.price === '' ? 0 : +s.price), 0);
  const unpriced = items.some(s => s.price === '' || isNaN(+s.price));
  w.innerHTML = (items.length ? '<div class="chips">' + items.map(s => `<button type="button" class="chip" data-rm="${s.id}">${esc(s.title)} ×</button>`).join('') + '</div>' : '') +
    `<div class="cartbar"><div class="cartinfo">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
      <span>корзина: <b>${items.length}</b>${items.length && total ? ' · ' + total.toLocaleString('ru-RU') + ' ₽' + (unpriced ? '+' : '') : ''}</span></div>
      <button type="button" class="calc-btn" id="calcBtn" ${items.length ? '' : 'disabled'}>посчитать</button></div>`;
  w.querySelectorAll('[data-rm]').forEach(c => c.onclick = () => { cart = cart.filter(x => x !== +c.dataset.rm); saveCart(); renderPrices(); });
  document.getElementById('calcBtn').onclick = () => {
    if (!items.length) return;
    let msg = 'Хочу рассчитать стоимость:\n' + items.map(s => '• ' + s.title + ' — ' + fmtPrice(s.price)).join('\n');
    if (total) msg += '\nИтого: ' + total.toLocaleString('ru-RU') + ' ₽' + (unpriced ? ' + позиции по запросу' : '');
    pendingOrder = msg;
    tab('contacts');
  };
}

function typeInto(el, text) {
  el.textContent = '';
  let i = 0;
  const t = setInterval(() => {
    el.textContent += text[i++] || '';
    if (i >= text.length) clearInterval(t);
  }, 24);
}

// ===== Cabinet: login / registration / admin =====
let authMode = 'login';
function getUsers() { try { return JSON.parse(localStorage.getItem('v3_users') || '[]'); } catch(e) { return []; } }
function getCurUser() { try { return JSON.parse(localStorage.getItem('v3_cur') || 'null'); } catch(e) { return null; } }

function renderCabinet() {
  const box = document.getElementById('authBox');
  const log = document.getElementById('authlog');
  const cur = getCurUser();
  if (isAdmin) return renderAdmin(box, log);

  if (cur) {
    box.innerHTML = `<div class="bubble admin-badge" style="color:#f3f3f1;border-color:rgba(255,255,255,.3)">Вы вошли: ${esc(cur.name || cur.login)}</div>
      <button type="button" class="admin-btn" id="userLogout">Выйти</button>`;
    log.innerHTML = '<div class="bubble">Здесь будут ваши проекты и статусы задач.</div>';
    document.getElementById('userLogout').onclick = () => { localStorage.removeItem('v3_cur'); renderCabinet(); };
    return;
  }

  box.innerHTML = `
    <div class="auth-choice">
      <button type="button" class="admin-btn ${authMode === 'login' ? 'sel' : ''}" id="modeLogin">Вход</button>
      <button type="button" class="admin-btn ${authMode === 'reg' ? 'sel' : ''}" id="modeReg">Регистрация</button>
    </div>
    ${authMode === 'login' ? `
      <input type="text" id="aLogin" class="admin-input" placeholder="Юзернейм или телефон" autocomplete="username" />
      <input type="password" id="aPass" class="admin-input" placeholder="Пароль" autocomplete="current-password" />
      <button type="button" id="doLogin" class="admin-btn">Войти</button>` : `
      <input type="text" id="rName" class="admin-input" placeholder="Имя" />
      <input type="text" id="rLogin" class="admin-input" placeholder="Юзернейм или телефон" />
      <input type="password" id="rPass" class="admin-input" placeholder="Придумайте пароль" />
      <button type="button" id="doReg" class="admin-btn">Зарегистрироваться</button>`}
  `;
  log.innerHTML = '<div class="bubble">Вход для клиентов студии.</div>';
  const err = (t) => { log.innerHTML = '<div class="bubble" style="border-color:#ef4444;color:#ef4444">' + t + '</div>'; };
  document.getElementById('modeLogin').onclick = () => { authMode = 'login'; renderCabinet(); };
  document.getElementById('modeReg').onclick = () => { authMode = 'reg'; renderCabinet(); };

  if (authMode === 'login') {
    document.getElementById('doLogin').onclick = () => {
      const login = document.getElementById('aLogin').value.trim();
      const pass = document.getElementById('aPass').value;
      if (login.toLowerCase() === 'vlad' && pass === '1986') { isAdmin = true; renderCabinet(); return; }
      if (!login || !pass) return err('Введите юзернейм или телефон и пароль.');
      const u = getUsers().find(x => x.login.toLowerCase() === login.toLowerCase() && x.pass === pass);
      if (!u) return err('Неверные данные. Проверьте логин и пароль или зарегистрируйтесь.');
      localStorage.setItem('v3_cur', JSON.stringify({ login:u.login, name:u.name }));
      renderCabinet();
    };
  } else {
    document.getElementById('doReg').onclick = () => {
      const name = document.getElementById('rName').value.trim();
      const login = document.getElementById('rLogin').value.trim();
      const pass = document.getElementById('rPass').value;
      if (!login || !pass) return err('Укажите юзернейм или телефон и пароль.');
      if (login.toLowerCase() === 'vlad') return err('Этот логин недоступен, выберите другой.');
      const users = getUsers();
      if (users.some(x => x.login.toLowerCase() === login.toLowerCase())) return err('Такой пользователь уже существует.');
      users.push({ name, login, pass });
      localStorage.setItem('v3_users', JSON.stringify(users));
      localStorage.setItem('v3_cur', JSON.stringify({ login, name }));
      renderCabinet();
    };
  }
}

  const c = getContactInfo();
  team = getTeam();
  box.innerHTML = `

    <input type="text" id="editTitle" class="admin-input" value="${esc(currentP.title)}" placeholder="Название проекта" />
    <input type="text" id="editCover" class="admin-input" value="${esc(currentP.img || '')}" placeholder="Фото обложки (URL/путь)" />

    <input type="text" id="editLink" class="admin-input" value="${esc(currentP.link || '')}" placeholder="Ссылка на проект (https://...)" />

    <textarea id="editDesc" class="admin-input" rows="2" placeholder="Полное описание">${esc(currentP.desc || '')}</textarea>
    <input type="text" id="editFree" class="admin-input" value="${esc(currentP.free || '')}" placeholder="Свободное поле" />

    <div style="font-size:11px;color:#aaa;font-weight:500;margin-top:8px">2. Команда</div>
    ${team.map((m, i) => `
      <input type="text" id="tn${i}" class="admin-input" value="${esc(m.name)}" placeholder="Имя" />
      <input type="text" id="tr${i}" class="admin-input" value="${esc(m.role)}" placeholder="Должность" />
      <input type="text" id="ta${i}" class="admin-input" value="${esc(m.avatar || '')}" placeholder="Аватар (URL/путь)" />
      <textarea id="tb${i}" class="admin-input" rows="2" placeholder="Описание">${esc(m.bio || '')}</textarea>`).join('<div style="height:1px;background:rgba(255,255,255,.12)"></div>')}

    <div style="font-size:11px;color:#aaa;font-weight:500;margin-top:8px">3. Контакты</div>
    <input type="text" id="cAddr" class="admin-input" value="${esc(c.address)}" placeholder="Адрес" />
    <input type="text" id="cPhone" class="admin-input" value="${esc(c.phone)}" placeholder="Телефон" />
    <input type="text" id="cTg" class="admin-input" value="${esc(c.telegram)}" placeholder="Telegram (https://t.me/...)" />
    <input type="text" id="cWa" class="admin-input" value="${esc(c.whatsapp)}" placeholder="WhatsApp (https://wa.me/7...)" />
    <input type="text" id="cIg" class="admin-input" value="${esc(c.instagram)}" placeholder="Instagram (https://instagram.com/...)" />

    <div style="display:flex;gap:8px;margin-top:6px">
      <button type="button" id="saveAdminBtn" class="admin-btn" style="flex:1">Сохранить всё</button>
      <button type="button" id="logoutAdminBtn" class="admin-btn" style="width:70px">Выйти</button>
    </div>`;
  log.innerHTML = '<div class="bubble">Изменения сохраняются на этом устройстве.</div>';
  const v = id => document.getElementById(id).value;
  document.getElementById('saveAdminBtn').onclick = () => {
    currentP.title = v('editTitle'); currentP.img = v('editCover'); currentP.shortText = v('editShort');
    currentP.link = v('editLink'); currentP.desc = v('editDesc'); currentP.free = v('editFree');
    currentP.gallery = v('editGallery').split(',').map(s => s.trim()).filter(Boolean);
    saveProjects(projects);
    team.forEach((m, i) => { m.name = v('tn'+i); m.role = v('tr'+i); m.avatar = v('ta'+i); m.bio = v('tb'+i); });
    saveTeam(team);
    try { localStorage.setItem('v3_contacts', JSON.stringify({ address:v('cAddr'), phone:v('cPhone'), telegram:v('cTg'), whatsapp:v('cWa'), instagram:v('cIg') })); } catch(e){}
    buildRail();
    log.innerHTML = '<div class="bubble" style="border-color:#4ade80;color:#4ade80">Данные успешно сохранены!</div>';
  };
  document.getElementById('logoutAdminBtn').onclick = () => { isAdmin = false; renderCabinet(); };
}


document.querySelectorAll('#dock button').forEach(b => b.onclick = () => tab(b.dataset.tab));

if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{});
