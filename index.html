<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="V³ Studio" />
<meta name="theme-color" content="#0c0c0c" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preload" href="ink.mp4" as="video" type="video/mp4" />
<link rel="preload" href="logo.png" as="image" />
<title>V³ studio</title>
<style>
  :root { --ink:#141414; --line:rgba(20,20,20,.4); --paper:#f6f6f4; --white:#f3f3f1; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; background:var(--paper); color:var(--ink); font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; touch-action:manipulation; }
  body.dark { --ink:#f3f3f1; --line:rgba(243,243,241,.32); --paper:#0c0c0c; background:#0c0c0c; color:#f3f3f1; }
  body.dark .logo { filter:invert(1); }
  button, a, input, textarea { font-family:inherit; color:inherit; }

  .scene { position:fixed; inset:0; display:none; height:100dvh; padding:env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px); }
  .scene.on { display:flex; z-index:8; align-items:center; justify-content:center; }

  .cross { position:fixed; inset:0; pointer-events:none; z-index:5; transition:opacity .4s; }
  .cross.off { opacity:0; }
  .cross i { position:absolute; background:var(--line); pointer-events:none; transition:left .75s cubic-bezier(.2,.8,.2,1), top .75s cubic-bezier(.2,.8,.2,1); }
  .cross .v { top:0; bottom:0; width:1px; left:50%; }
  .cross .h { left:0; right:0; height:1px; top:50%; }

  .frame { position:fixed; inset:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); border:1px solid var(--line); pointer-events:none; z-index:4; transition:opacity .6s; }
  .frame.off { opacity:0; }

  /* Wireframe Globe */
  .globe-wrap { position:fixed; top:48%; right:-110px; width:84px; height:84px; z-index:5; pointer-events:none; opacity:0; }
  .globe-wrap.on { opacity:.75; animation:rollGlobe 9s linear 1 forwards; }
  @keyframes rollGlobe {
    0% { transform:translateX(0) rotate(0deg); }
    100% { transform:translateX(-140vw) rotate(-720deg); }
  }
  .globe-svg { width:100%; height:100%; stroke:var(--ink); fill:none; stroke-width:1; }
  body.dark .globe-svg { stroke:var(--white); }

  #home, #after, #how { align-items:center; justify-content:center; flex-direction:column; }
  .mark { position:relative; width:min(230px, 62vw); height:min(250px, 38vh); display:grid; place-items:center; }
  .logo { height:min(200px, 34vh); width:auto; }

  .btn { position:relative; z-index:2; overflow:hidden; margin-top:24px; border:1px solid currentColor; border-radius:30px; background:transparent; padding:12px 28px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; opacity:0; transform:translateY(14px); transition:opacity .6s, transform .6s, background .3s; }
  .btn.show { opacity:1; transform:none; }
  .btn:active { background:rgba(255,255,255,.1); }
  .btn .glint { position:absolute; top:0; left:-120%; width:80%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); transform:skewX(-20deg); }
  .btn.glint .glint { animation:shine 2.4s ease-in-out infinite; }
  @keyframes shine { to { left:180%; } }

  /* Film Scene */
  #film { padding:0; background:#000; }
  #vid { width:100%; height:100%; object-fit:cover; display:block; }
  .shade { position:absolute; inset:0; background:radial-gradient(circle, transparent 40%, rgba(0,0,0,.65) 100%); pointer-events:none; }
  #film .cross { position:absolute; inset:0; z-index:3; pointer-events:none; }
  #film .cross i { background:rgba(255,255,255,.55); }
  
  .skip-btn { position:absolute; top:max(20px, env(safe-area-inset-top)); right:20px; z-index:10; border:1px solid rgba(255,255,255,.2); border-radius:20px; background:rgba(0,0,0,.22); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); color:rgba(255,255,255,.7); font-size:10px; letter-spacing:.18em; text-transform:uppercase; padding:6px 14px; cursor:pointer; transition:.3s; }
  .skip-btn:active { background:rgba(255,255,255,.18); color:#fff; }

  .cap { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 24px; opacity:0; transition:opacity .4s; pointer-events:none; }
  .cap.on { opacity:1; }
  #phrase { font-size:clamp(22px, 6vw, 36px); letter-spacing:.06em; line-height:1.35; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.9); display:inline-block; }

  /* After / Cipher */
  .cipher { max-width:18em; padding:0 24px; text-align:center; font-size:clamp(16px, 4.2vw, 26px); line-height:1.45; letter-spacing:.08em; min-height:3em; }

  /* How Scene & Canvas Cosmic Spiral Vortex */
  #how { position:relative; overflow:hidden; }
  #how .steps { width:100%; max-width:320px; display:flex; flex-direction:column; gap:18px; text-align:center; z-index:3; }
  #how .steps p { margin:0; font-size:18px; letter-spacing:.2em; text-transform:uppercase; opacity:0; transform:translateY(24px); transition:opacity .6s, transform .6s; }
  #how .steps p.in { opacity:1; transform:none; }
  
  .vortex-canvas-box { width:min(320px, 85vw); height:160px; margin-top:16px; z-index:2; opacity:0; transition:opacity .8s; border-radius:18px; overflow:hidden; pointer-events:none; position:relative; }
  .vortex-canvas-box.on { opacity:.9; }
  #vortexCanvas { width:100%; height:100%; display:block; }

  /* Gallery */
  #gallery { background:#0c0c0c; color:#f3f3f1; display:none; flex-direction:column; padding:env(safe-area-inset-top, 16px) 0 env(safe-area-inset-bottom, 16px); }
  #gallery.on { display:flex; }
  .gtop { padding:16px 20px 0; text-align:center; letter-spacing:.18em; font-size:11px; text-transform:uppercase; color:#888; }
  .rail { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:18px 16vw 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .rail::-webkit-scrollbar { display:none; }
  .card { flex:0 0 65vw; max-width:320px; scroll-snap-align:center; opacity:.45; transform:scale(.92); transition:.4s; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,.15); }
  .card.focus { opacity:1; transform:none; border-color:rgba(255,255,255,.4); }
  .card img { width:100%; height:38vh; min-height:220px; object-fit:cover; display:block; }
  
  .note { width:min(520px, calc(100% - 40px)); margin:6px auto 0; padding:12px 16px; border:1px solid rgba(255,255,255,.12); border-radius:14px; background:rgba(255,255,255,.03); }
  .note-top { display:flex; justify-content:space-between; align-items:center; }
  .note-top h2 { font-size:16px; letter-spacing:.1em; text-transform:uppercase; font-weight:500; }
  .note-actions { display:flex; gap:10px; align-items:center; }
  .btn-detail { border:1px solid rgba(255,255,255,.3); border-radius:16px; background:transparent; font-size:10px; letter-spacing:.14em; text-transform:uppercase; padding:5px 12px; cursor:pointer; }
  .btn-detail:active { background:rgba(255,255,255,.15); }
  .x { border:0; background:transparent; font-size:22px; cursor:pointer; width:30px; height:30px; display:grid; place-items:center; color:#fff; }
  .full { max-height:0; overflow:hidden; color:#a0a0a0; font-size:12px; line-height:1.5; transition:max-height .4s ease, margin .3s; }
  .full.open { max-height:140px; margin-top:10px; }
  .discuss { margin:14px auto 10px; }

  /* Project Modal */
  .modal { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:20px; }
  .modal.on { display:flex; }
  .modal-box { width:min(500px, 100%); max-height:85vh; background:#141414; border:1px solid rgba(255,255,255,.2); border-radius:20px; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:16px; position:relative; }
  .modal-close { position:absolute; top:16px; right:16px; border:0; background:transparent; font-size:24px; color:#aaa; cursor:pointer; }
  .modal-title { font-size:18px; letter-spacing:.12em; text-transform:uppercase; margin-right:30px; }
  .modal-link { color:#6bb6ff; font-size:12px; text-decoration:none; word-break:break-all; }
  .modal-gallery { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .modal-gallery img { height:110px; width:150px; object-fit:cover; border-radius:8px; border:1px solid rgba(255,255,255,.15); flex:0 0 auto; }
  .modal-desc { font-size:13px; color:#ccc; line-height:1.55; }
  .modal-free { font-size:12px; color:#888; border-top:1px dashed rgba(255,255,255,.15); padding-top:12px; }

  /* Fullscreen Design Showcase Modal for Effect */
  .showcase-overlay { position:fixed; inset:0; z-index:40; background:#000; display:none; flex-direction:column; justify-content:center; align-items:center; }
  .showcase-overlay.on { display:flex; }
  .showcase-bg-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.75; filter:contrast(1.1); }
  .showcase-hud { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:space-between; padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .showcase-top { display:flex; justify-content:space-between; align-items:center; color:#fff; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .showcase-center-btn { align-self:center; margin:auto 0; border:2px solid #fff; border-radius:30px; background:rgba(0,0,0,.65); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; padding:14px 34px; cursor:pointer; box-shadow:0 0 30px rgba(255,255,255,.3); transition:.2s; }
  .showcase-center-btn:active { transform:scale(.94); }
  .showcase-caption { text-align:center; color:#fff; font-size:12px; letter-spacing:.1em; text-transform:uppercase; text-shadow:0 2px 10px rgba(0,0,0,.9); }

  /* Team view */
  .team-list { width:100%; display:flex; flex-direction:column; gap:12px; }
  .team-card { display:flex; gap:12px; align-items:flex-start; border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px; background:rgba(255,255,255,.02); }
  .team-avatar { width:48px; height:48px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.25); flex:0 0 auto; }
  .team-info { flex:1; }
  .team-header { display:flex; justify-content:space-between; align-items:center; }
  .team-name { font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; }
  .team-role { font-size:11px; color:#888; margin-top:2px; }
  .team-bio { max-height:0; overflow:hidden; color:#a0a0a0; font-size:11.5px; line-height:1.45; transition:max-height .3s ease, margin .3s; }
  .team-bio.open { max-height:120px; margin-top:6px; }
  .team-expand { border:0; background:transparent; font-size:18px; cursor:pointer; color:#aaa; width:24px; height:24px; display:grid; place-items:center; }

  /* Contacts view */
  .contact-block { display:flex; flex-direction:column; gap:10px; width:100%; }
  .contact-row { display:flex; flex-direction:column; gap:4px; padding:12px; border:1px solid rgba(255,255,255,.12); border-radius:12px; background:rgba(255,255,255,.02); }
  .contact-name { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.12em; }
  .contact-val { font-size:14px; letter-spacing:.06em; color:#6bb6ff; text-decoration:none; font-weight:500; }
  .contact-address { font-size:13px; color:#ddd; line-height:1.4; }

  /* Tariffs view with Expandable details */
  .tariff-item { display:flex; flex-direction:column; gap:6px; padding:12px 14px; border:1px solid rgba(255,255,255,.14); border-radius:14px; background:rgba(255,255,255,.02); }
  .tariff-header { display:flex; justify-content:space-between; align-items:center; }
  .tariff-title { font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .tariff-price { font-size:13px; font-weight:700; color:#4ade80; }
  .tariff-expand-btn { border:0; background:transparent; font-size:18px; cursor:pointer; color:#aaa; width:24px; height:24px; display:grid; place-items:center; }
  .tariff-full-desc { max-height:0; overflow:hidden; color:#a0a0a0; font-size:11.5px; line-height:1.5; transition:max-height .3s ease, margin .3s; }
  .tariff-full-desc.open { max-height:160px; margin-top:8px; border-top:1px dashed rgba(255,255,255,.12); padding-top:8px; }
  .tariff-select-btn { align-self:flex-start; margin-top:8px; border:1px solid rgba(255,255,255,.25); border-radius:14px; background:transparent; color:#fff; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:4px 10px; cursor:pointer; }
  .tariff-select-btn:active { background:rgba(255,255,255,.15); }

  /* Fixed Dock */
  .dock { position:fixed; left:12px; right:12px; bottom:12px; z-index:9; height:50px; border:1px solid rgba(243,243,241,.28); border-radius:25px; background:rgba(12,12,12,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); opacity:0; transform:translateY(12px); pointer-events:none; transition:.4s ease; display:flex; padding:4px; }
  .dock.on { opacity:1; transform:none; pointer-events:auto; }
  .dock i#pill { position:absolute; top:4px; bottom:4px; width:calc((100% - 8px) / 4); left:4px; border-radius:20px; background:rgba(243,243,241,.18); transition:transform .3s cubic-bezier(.2,.8,.2,1); pointer-events:none; }
  .dock button { flex:1; position:relative; z-index:1; border:0; background:transparent; color:#8d8d8d; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  .dock button.on { color:#fff; }

  /* Auth / Cabinet view */
  .auth { display:flex; gap:10px; padding:10px 14px 0; }
  .auth button { border:1px solid currentColor; border-radius:30px; background:transparent; height:34px; padding:0 18px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; }
  .auth button.active { background:rgba(255,255,255,.18); color:#fff; }

  /* Admin form & panel elements */
  .log { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width:92%; padding:10px 12px; font-size:12px; line-height:1.45; border:1px solid rgba(243,243,241,.18); border-radius:12px; background:rgba(255,255,255,.03); }
  .bubble.you { align-self:flex-end; background:rgba(243,243,241,.12); }
  .bubble.admin-badge { border-color:#4ade80; color:#4ade80; font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  
  .auth-box { display:flex; flex-direction:column; gap:10px; padding:14px; overflow-y:auto; flex:1; }
  .admin-input { width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.2); border-radius:10px; color:#fff; font-size:12px; padding:8px 10px; outline:none; }
  .admin-input:focus { border-color:#fff; }
  .admin-btn { border:1px solid currentColor; border-radius:18px; background:transparent; height:34px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  .admin-btn:active { background:rgba(255,255,255,.15); }
  
  form#form { display:flex; gap:8px; padding:10px 12px; border-top:1px solid rgba(243,243,241,.12); }
  form#form input { flex:1; background:transparent; border:0; color:inherit; font-size:13px; padding:6px 0; outline:none; }
  form#form button { border:0; background:transparent; cursor:pointer; width:32px; height:32px; padding:0; display:grid; place-items:center; }
</style>
</head>
<body>

<div class="frame" id="frame"></div>
<div class="cross" id="cross"><i class="v"></i><i class="h"></i></div>

<!-- Compact Wireframe Globe Scene Background -->
<div class="globe-wrap" id="globe">
  <svg class="globe-svg" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" />
    <ellipse cx="50" cy="50" rx="46" ry="18" />
    <ellipse cx="50" cy="50" rx="46" ry="34" />
    <ellipse cx="50" cy="50" rx="18" ry="46" />
    <ellipse cx="50" cy="50" rx="34" ry="46" />
    <line x1="50" y1="4" x2="50" y2="96" />
    <line x1="4" y1="50" x2="96" y2="50" />
  </svg>
</div>

<!-- 1. Home -->
<section class="scene on" id="home">
  <div class="mark" id="mark">
    <img id="logo" class="logo" src="logo.png" alt="V³ studio" />
  </div>
  <button type="button" class="btn" id="start">дизайн для бизнеса<span class="glint"></span></button>
</section>

<!-- 2. Film -->
<section class="scene" id="film">
  <button type="button" class="skip-btn" id="skipFilm">пропустить</button>
  <video id="vid" preload="auto" playsinline webkit-playsinline poster="frames/f01.jpg">
    <source src="ink.mp4" type="video/mp4" />
  </video>
  <div class="shade"></div>
  <div class="cross" id="film-cross"><i class="v"></i><i class="h"></i></div>
  <div class="cap" id="cap"><span id="phrase"></span></div>
</section>

<!-- 3. After -->
<section class="scene" id="after">
  <div class="cipher" id="cipher"></div>
  <button type="button" class="btn" id="howBtn">как мы работаем<span class="glint"></span></button>
</section>

<!-- 4. How -->
<section class="scene" id="how">
  <div class="steps">
    <p>слушаем</p>
    <p>думаем</p>
    <p>внедряем</p>
  </div>
  <button type="button" class="btn" id="see">посмотреть<span class="glint"></span></button>
  <div class="vortex-canvas-box" id="vortexBox">
    <canvas id="vortexCanvas"></canvas>
  </div>
</section>

<!-- 5. Gallery -->
<section class="scene" id="gallery">
  <div class="gtop">примеры проектов</div>
  <div class="rail" id="rail"></div>
  <div class="note">
    <div class="note-top">
      <h2 id="gtitle">жест</h2>
      <div class="note-actions">
        <button type="button" class="btn-detail" id="openDetail">детально</button>
        <button type="button" class="x" id="expand">+</button>
      </div>
    </div>
    <div class="full" id="full">Кадр задаёт характер раньше слов.</div>
  </div>
  <button type="button" class="btn discuss" id="discuss">обсудим?<span class="glint"></span></button>
</section>

<!-- Project Detail Modal -->
<div class="modal" id="projectModal">
  <div class="modal-box">
    <button type="button" class="modal-close" id="closeModal">×</button>
    <h3 class="modal-title" id="modalTitle">Название проекта</h3>
    <a href="#" target="_blank" rel="noreferrer" class="modal-link" id="modalLink">Перейти к проекту →</a>
    <div class="modal-gallery" id="modalGallery"></div>
    <div class="modal-desc" id="modalDesc">Описание</div>
    <div class="modal-free" id="modalFree">Свободное поле</div>
  </div>
</div>

<!-- Fullscreen Website Showcase Overlay -->
<div class="showcase-overlay" id="showcaseModal">
  <img class="showcase-bg-img" id="showcaseImg" src="frames/f01.jpg" alt="mockup">
  <div class="showcase-hud">
    <div class="showcase-top">
      <span id="showcaseCounter">КОНЦЕПЦИЯ 1 / 6</span>
      <button type="button" id="closeShowcase" style="border:0; background:transparent; color:#fff; font-size:24px; cursor:pointer;">×</button>
    </div>
    <button type="button" class="showcase-center-btn" id="nextShowcaseBtn">ДАЛЕЕ →</button>
    <div class="showcase-caption">уникальность дизайна определяет философию вашего проекта</div>
  </div>
</div>

<!-- 6. Shell -->
<section class="scene" id="shell">
  <div class="ticker">
    <div class="ticker-track" id="ticker"></div>
  </div>
  <div class="stage">
    <div class="panel" id="panel"></div>
  </div>
</section>

<!-- Bottom Dock -->
<nav class="dock" id="dock">
  <i id="pill"></i>
  <button type="button" data-tab="studio">о нас</button>
  <button type="button" data-tab="dialog">диалог</button>
  <button type="button" data-tab="cabinet">личный кабинет</button>
  <button type="button" data-tab="prices">тарифы</button>
</nav>

<script>
// Data store for projects & team
const defaultProjects = [
  { id: 0, img: 'frames/f01.jpg', title: 'жест', shortText: 'Кадр задаёт характер раньше слов.', link: 'https://v3.studio/project-1', gallery: ['frames/f01.jpg', 'frames/f03.jpg'], desc: 'Разработка визуальной концепции и фирменного стиля бренда.', free: 'Арт-дирекшн: V³ Studio • 2026' },

// 60fps Canvas Cosmic Vortex
let vortexAnimId = null;
const canvas = document.getElementById('vortexCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function initParticles() {
  particles = [];
  const count = 160;
  for (let i = 0; i < count; i++) {
    particles.push({
      angle: Math.random() * Math.PI * 2,
      radius: 12 + Math.random() * 110,
      speed: 0.015 + Math.random() * 0.025,
      size: 0.8 + Math.random() * 1.8,
      opacity: 0.3 + Math.random() * 0.7
    });
  }
}

function startVortexCanvas() {
  const rect = vortexBox.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
  initParticles();
  
  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.fillStyle = 'rgba(12, 12, 12, 0.22)';
    ctx.fillRect(0, 0, w, h);
    
    const cx = w / 2;
    const cy = h / 2;
    
    ctx.beginPath();
    ctx.arc(cx, cy, 10 * (window.devicePixelRatio || 1), 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    
    particles.forEach(p => {
      p.angle += p.speed;
      p.radius -= 0.18;
      if (p.radius < 8) {
        p.radius = 110 + Math.random() * 20;
        p.angle = Math.random() * Math.PI * 2;
      }
      const x = cx + Math.cos(p.angle) * p.radius * (window.devicePixelRatio || 1);
      const y = cy + Math.sin(p.angle) * (p.radius * 0.42) * (window.devicePixelRatio || 1);
      
      ctx.beginPath();
      ctx.arc(x, y, p.size * (window.devicePixelRatio || 1), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(245, 245, 245, ' + p.opacity + ')';
      ctx.fill();
    });
    
    vortexAnimId = requestAnimationFrame(draw);
  }
  if (!vortexAnimId) draw();
}

function stopVortexCanvas() {
  if (vortexAnimId) {
    cancelAnimationFrame(vortexAnimId);
    vortexAnimId = null;
  }
}

// After Cipher Animation
function cipher() {
  const phraseText = 'создание дизайна и решений для проектов';
  const box = document.getElementById('cipher');
  const chars = phraseText.split('');
  const glyphs = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ';
  const open = chars.map(c => c === ' ');
  const draw = () => {
    box.textContent = chars.map((c,i) => c === ' ' || open[i] ? c : glyphs[Math.floor(Math.random()*glyphs.length)]).join('');
  };
  draw();
  const timer = setInterval(() => {
    const closed = open.map((v,i) => !v && chars[i] !== ' ' ? i : -1).filter(i => i >= 0);
    if (!closed.length) {
      clearInterval(timer);
      box.textContent = phraseText;
      document.getElementById('howBtn').classList.add('show');
      return;
    }
    open[closed[Math.floor(Math.random()*closed.length)]] = true;
    draw();
  }, 36);
}

function buildRail() {
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  projects = getProjects();
  projects.forEach((p, i) => {
    const d = document.createElement('article');
    d.className = 'card' + (i === currentProjectIndex ? ' focus' : '');
    d.innerHTML = '<img alt="' + p.title + '" src="' + p.img + '">';
    d.dataset.index = i;
    rail.appendChild(d);
  });
  updateCardInfo(currentProjectIndex);
  
  rail.onscroll = () => {
    const cards = [...rail.children];
    const mid = rail.scrollLeft + rail.clientWidth / 2;
    let best = 0, dist = 1e9;
    cards.forEach((c, i) => {
      const dd = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
      if (dd < dist) { dist = dd; best = i; }
    });
    cards.forEach((c, i) => c.classList.toggle('focus', i === best));
    currentProjectIndex = best;
    updateCardInfo(best);
  };
}

// Fullscreen Showcase Logic
function openShowcase() {
  const modal = document.getElementById('showcaseModal');
  showcaseSlide = 0;
  updateShowcaseDisplay();
  modal.classList.add('on');

  document.getElementById('closeShowcase').onclick = () => modal.classList.remove('on');
  document.getElementById('nextShowcaseBtn').onclick = () => {
    showcaseSlide++;
    if (showcaseSlide >= showcaseImages.length) {
      modal.classList.remove('on');
    } else {
      updateShowcaseDisplay();
    }
  };
}

function updateShowcaseDisplay() {
  document.getElementById('showcaseImg').src = showcaseImages[showcaseSlide];
  document.getElementById('showcaseCounter').textContent = `КОНЦЕПЦИЯ ${showcaseSlide + 1} / ${showcaseImages.length}`;
  document.getElementById('nextShowcaseBtn').textContent = (showcaseSlide === showcaseImages.length - 1) ? 'ЗАВЕРШИТЬ ✕' : 'ДАЛЕЕ →';
}

// Smooth Black Background Erasure Canvas (Smooth fading to white background beneath)
function setupEraseCanvas() {
  const c = document.getElementById('eraseCanvas');
  if (!c) return;
  const box = document.getElementById('eraseBox');
  c.width = box.clientWidth;
  c.height = box.clientHeight;
  const cctx = c.getContext('2d');
  
  cctx.fillStyle = '#0c0c0c';
  cctx.fillRect(0, 0, c.width, c.height);
  cctx.fillStyle = '#666';
  cctx.font = '11px monospace';
  cctx.textAlign = 'center';
  cctx.fillText('ПРОВЕДИТЕ ПАЛЬЦЕМ', c.width / 2, c.height / 2);

  let isDrawing = false;
  function erase(e) {
    if (!isDrawing) return;
    const rect = c.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
    
    cctx.globalCompositeOperation = 'destination-out';
    cctx.beginPath();
    const rad = cctx.createRadialGradient(x, y, 6, x, y, 32);
    rad.addColorStop(0, 'rgba(0,0,0,1)');
    rad.addColorStop(1, 'rgba(0,0,0,0)');
    cctx.fillStyle = rad;
    cctx.arc(x, y, 32, 0, Math.PI * 2);
    cctx.fill();
  }

  c.addEventListener('pointerdown', (e) => { isDrawing = true; erase(e); });
  c.addEventListener('pointermove', erase);
  window.addEventListener('pointerup', () => { isDrawing = false; });
}

// 3D Cube Rotation + Particle trail
function setupCubeInteraction() {
  const stage = document.getElementById('cubeStage');
  const cube = document.getElementById('cube3D');
  if (!stage || !cube) return;
  
  let isDown = false;
  let startX, startY;
  
  function updateCube() {
    cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }
  updateCube();
  
  function spawnTrail(x, y) {
    const dot = document.createElement('div');
    dot.className = 'trail-dot';
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    stage.appendChild(dot);
    setTimeout(() => dot.remove(), 550);
  }

  stage.addEventListener('pointerdown', (e) => {
    isDown = true;
    startX = e.clientX;
    startY = e.clientY;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!isDown) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    rotY += dx * 0.7;
    rotX -= dy * 0.7;
    startX = e.clientX;
    startY = e.clientY;
    updateCube();

    const rect = stage.getBoundingClientRect();
    spawnTrail(e.clientX - rect.left, e.clientY - rect.top);
  });
  function endDrag() { isDown = false; }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
}

// Dialog Flow
let dialogStep = 1;
let clientProject = '';
let clientName = '';

function renderDialogFlow() {
  const log = document.getElementById('log');
  log.innerHTML = '';
  dialogStep = 1;

  appendBotBubble('Здравствуйте. Напишите название проекта и сфера вашей деятельности.');

  document.getElementById('form').onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById('msg');
    const v = input.value.trim();
    if (!v) return;

    appendUserBubble(v);
    input.value = '';

    if (dialogStep === 1) {
      clientProject = v;
      dialogStep = 2;
      setTimeout(() => appendBotBubble('Как к вам можно обращаться?'), 300);
    } else if (dialogStep === 2) {
      clientName = v;
      dialogStep = 3;
      if (!selectedTariff) {
        setTimeout(() => {
          appendBotBubble('Вы можете посетить раздел «Тарифы» и подобрать интересующие вас услуги, чтобы продолжить диалог.');
        }, 300);
      } else {
        setTimeout(() => {
          appendBotBubble(`Спасибо, ${clientName}! Вы выбрали услугу: ${selectedTariff}. Заявка передана арт-директору студии.`);
        }, 300);
      }
    } else {
      setTimeout(() => {
        appendBotBubble(`Принято, ${clientName || 'партнёр'}. Мы свяжемся с вами по проекту «${clientProject}».`);
      }, 300);
    }
  };
}

function appendBotBubble(text) {
  const log = document.getElementById('log');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  log.appendChild(bubble);
  typeInto(bubble, text);
  log.scrollTop = log.scrollHeight;
}

function appendUserBubble(text) {
  const log = document.getElementById('log');
  const you = document.createElement('div');
  you.className = 'bubble you';
  you.textContent = text;
  log.appendChild(you);
  log.scrollTop = log.scrollHeight;
}

function typeInto(el, text) {
  el.textContent = '';
  let i = 0;
  const t = setInterval(() => {
    el.textContent += text[i++] || '';
    if (i >= text.length) clearInterval(t);
  }, 20);
}

// Cabinet View (Login / Reg / Admin Unlock by 1986)
function renderCabinet(mode) {
  const box = document.getElementById('authBox');
  const log = document.getElementById('authlog');
  const loginTab = document.getElementById('authLoginTab');
  const regTab = document.getElementById('authRegTab');

  if (loginTab && regTab) {
    loginTab.classList.toggle('active', mode === 'login');
    regTab.classList.toggle('active', mode === 'reg');
    loginTab.onclick = () => renderCabinet('login');
    regTab.onclick = () => renderCabinet('reg');
  }

  if (!isAdmin) {
    if (mode === 'login') {
      box.innerHTML = `
        <input type="text" id="userEmail" class="admin-input" placeholder="Email или логин..." />
        <input type="password" id="adminPass" class="admin-input" placeholder="Пароль доступа..." />
        <button type="button" id="adminLoginBtn" class="admin-btn">Войти в кабинет</button>
      `;
      log.innerHTML = '<div class="bubble">Авторизация для клиентов студии и доступ администратора.</div>';
    } else {
      box.innerHTML = `
        <input type="text" id="regName" class="admin-input" placeholder="Ваше имя / Компания..." />
        <input type="email" id="regEmail" class="admin-input" placeholder="Email для связи..." />
        <input type="password" id="regPass" class="admin-input" placeholder="Придумайте пароль..." />
        <button type="button" id="adminRegBtn" class="admin-btn">Зарегистрироваться</button>
      `;
      log.innerHTML = '<div class="bubble">Регистрация нового клиента студии. Сюда сядет аккаунт проекта.</div>';
    }

    const btn = document.getElementById('adminLoginBtn') || document.getElementById('adminRegBtn');
    if (btn) {
      btn.onclick = () => {
        const pass = (document.getElementById('adminPass') || document.getElementById('regPass')).value;
        if (pass === '1986') {
          isAdmin = true;
          renderAdminPanel();
        } else {
          log.innerHTML = '<div class="bubble">Кабинет клиента в разработке. Для админ-доступа введите ключ.</div>';
        }
      };
    }
  } else {
    renderAdminPanel();
  }
}
