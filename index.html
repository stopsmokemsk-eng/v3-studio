<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<link rel="preload" href="ink.mp4" as="video" type="video/mp4" />
<title>V³ studio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#141414; --line:rgba(20,20,20,.4); --paper:#f6f6f4; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; background:var(--paper); color:var(--ink); font-family:"IBM Plex Mono", ui-monospace, monospace; touch-action:manipulation; }
  .scene { position:fixed; inset:0; display:none; height:100dvh; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .scene.on { display:flex; z-index:8; align-items:center; justify-content:center; }
  body.dark { --ink:#f3f3f1; --line:rgba(243,243,241,.32); --paper:#0c0c0c; background:#0c0c0c; color:#f3f3f1; }
  body.dark .logo { filter:invert(1); }
  button, a, input { font-family:inherit; color:inherit; }
  .scene { position:fixed; inset:0; display:none; }
  .cross { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .cross.off { opacity:0; }
  .cross i { position:absolute; background:var(--line); transition:left .8s ease, top .8s ease; pointer-events:none; }
  .cross .v { top:0; bottom:0; width:1px; left:50%; }
  .cross .h { left:0; right:0; height:1px; top:50%; }
  .mark { position:relative; width:min(230px, 62vw); height:min(250px, 38vh); display:grid; place-items:center; }
  .frame { position:fixed; inset:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); border:1px solid var(--line); pointer-events:none; z-index:4; transition:opacity .6s; }
  .frame.off { opacity:0; }
  .weed { position:fixed; top:46%; right:-90px; width:78px; height:78px; z-index:5; pointer-events:none; opacity:0; }
  .weed.on { opacity:.9; animation:roll 8s linear 1 forwards; }
  @keyframes roll { to { transform:translateX(-120vw) rotate(-680deg); } }
  .leaves { position:fixed; inset:0; pointer-events:none; z-index:4; opacity:0; }
  .leaves.on { opacity:1; }
  .leaves svg { position:absolute; top:-40px; width:28px; height:28px; animation:fall 7s linear infinite; }
  .leaves svg:nth-child(2) { left:22%; animation-delay:-2s; animation-duration:8s; }
  .leaves svg:nth-child(3) { left:48%; animation-delay:-4s; animation-duration:6.5s; }
  .leaves svg:nth-child(4) { left:70%; animation-delay:-1s; }
  .leaves svg:nth-child(5) { left:86%; animation-delay:-3s; animation-duration:9s; }
  @keyframes fall { to { transform:translateY(110vh) rotate(180deg); } }
  #how .steps { width:100%; justify-items:center; text-align:center; }
  .ducks { position:absolute; left:0; bottom:18px; width:180px; height:36px; pointer-events:none; opacity:0; z-index:3; }
  .ducks.on { opacity:.9; animation:walk 9s linear 1 forwards; }
  @keyframes walk { from { transform:translateX(-40vw); } to { transform:translateX(110vw); } }
  .card.hint { animation:sway 1.5s ease-in-out 2; }
  @keyframes sway { 50% { transform:translateX(-16px) scale(.9); } }
  #home, #after, #how { align-items:center; justify-content:center; flex-direction:column; }
  .logo { height:min(200px, 34vh); width:auto; }
  .btn { position:relative; z-index:2; overflow:hidden; margin-top:34px; border:1px solid currentColor; border-radius:30px; background:transparent; height:36px; padding:0 26px; font-size:11px; letter-spacing:.08em; cursor:pointer; opacity:0; transform:translateY(8px); pointer-events:auto; -webkit-tap-highlight-color:transparent; }
  .btn.show { opacity:1; transform:none; transition:opacity 1s ease, transform 1s ease; }
  .btn .glint { position:absolute; inset:0; background:linear-gradient(100deg, transparent 30%, rgba(20,20,20,.5) 50%, transparent 70%); transform:translateX(-120%); }
  .btn.glint .glint { animation:glint 1s ease forwards; }
  @keyframes glint { to { transform:translateX(120%); } }
  #film { background:#000; }
  #film video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #film .cross { position:absolute; inset:0; z-index:3; pointer-events:none; }
  #film .shade { position:absolute; inset:0; background:rgba(0,0,0,.38); }
  .cap { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font-size:clamp(22px, 6vw, 40px); line-height:1.2; padding:28px; opacity:0; transition:opacity .4s; }
  .cap.on { opacity:1; }
  .cipher { max-width:16em; text-align:center; font-size:clamp(18px, 4.4vw, 28px); line-height:1.45; min-height:3em; }
  #how { position:relative; align-items:center; justify-content:center; flex-direction:column; }
  .trio { display:flex; gap:8px; padding:8px 12px 0; }
  .trio button, .auth button { border:1px solid currentColor; border-radius:30px; background:transparent; height:32px; padding:0 12px; font-size:11px; cursor:pointer; }
  .fx { min-height:180px; display:grid; place-items:center; position:relative; }
  .cube3 { width:84px; height:84px; position:relative; transform-style:preserve-3d; animation:spin 8s linear infinite; }
  .cube3 i { position:absolute; inset:0; border:1px solid currentColor; }
  .cube3 i:nth-child(1){ transform:rotateY(0) translateZ(42px); }
  .cube3 i:nth-child(2){ transform:rotateY(180deg) translateZ(42px); }
  .cube3 i:nth-child(3){ transform:rotateY(90deg) translateZ(42px); }
  .cube3 i:nth-child(4){ transform:rotateY(-90deg) translateZ(42px); }
  .cube3 i:nth-child(5){ transform:rotateX(90deg) translateZ(42px); }
  .cube3 i:nth-child(6){ transform:rotateX(-90deg) translateZ(42px); }
  @keyframes spin { to { transform:rotateX(360deg) rotateY(360deg); } }
  .core { position:absolute; inset:0; display:grid; place-items:center; font-size:11px; letter-spacing:.04em; text-align:center; max-width:9em; }
  .bulb.on path.glass { fill:rgba(243,220,120,.85); }
  .dream { position:fixed; inset:0; z-index:20; display:none; pointer-events:none; background:#f4b7c8; overflow:hidden; }
  .dream.on { display:block; }
  .dream i { position:absolute; border:1px solid rgba(255,255,255,.8); border-radius:40px; height:36px; }
  .dream i:nth-child(1){ width:90px; top:18%; animation:drift 10s linear; }
  .dream i:nth-child(2){ width:120px; top:40%; animation:drift 8s linear reverse; }
  .dream i:nth-child(3){ width:70px; top:66%; animation:drift 9s linear; }
  .uni { position:absolute; left:50%; top:46%; width:88px; margin-left:-44px; animation:hop .55s ease-in-out infinite; }
  @keyframes drift { from { left:-30%; } to { left:110%; } }
  @keyframes hop { 50% { transform:translateY(-22px); } }
  .cipher { max-width:18em; padding:0 24px; text-align:center; font-size:clamp(16px, 4.2vw, 26px); line-height:1.45; }
  #how .steps p { margin:0; font-size:16px; letter-spacing:.14em; opacity:0; transform:translateY(24px); }
  #how .steps p.in { animation:rise .7s ease forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  #gallery { background:#0c0c0c; color:#f3f3f1; display:none; flex-direction:column; }
  #gallery.on { display:flex; }
  .gtop { padding:32px 20px 0; text-align:center; letter-spacing:.18em; font-size:11px; text-transform:uppercase; }
  .rail { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:18px 16vw 8px; scrollbar-width:none; }
  .rail::-webkit-scrollbar { display:none; }
  .card { flex:0 0 62vw; scroll-snap-align:center; opacity:.45; transform:scale(.9); transition:.4s; }
  .card.focus { opacity:1; transform:none; }
  .card img { width:100%; height:40vh; object-fit:cover; display:block; }
  .note { width:min(520px, calc(100% - 40px)); margin:6px auto 0; }
  .note-top { display:flex; justify-content:space-between; }
  .x { border:0; background:transparent; font-size:18px; cursor:pointer; }
  .full { max-height:0; overflow:hidden; color:#bdbdbd; font-size:12px; }
  .full.open { max-height:120px; margin-top:8px; }
  .discuss { margin:14px auto 24px; }
  #shell { background:#0c0c0c; color:#f3f3f1; display:none; flex-direction:column; padding:0 0 96px; }
  #shell.on { display:flex; }
  .ticker { overflow:hidden; border-bottom:1px solid rgba(243,243,241,.2); flex:0 0 auto; }
  .ticker-track { display:flex; gap:26px; width:max-content; animation:marquee 28s linear infinite; padding:12px 0; font-size:11px; letter-spacing:.12em; }
  .ticker a { color:inherit; text-decoration:none; }
  @keyframes marquee { to { transform:translateX(-50%); } }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; }
  .panel { width:min(420px, 100%); height:min(460px, 62vh); border:1px solid rgba(243,243,241,.28); border-radius:22px; display:flex; flex-direction:column; background:#111; }
  .panel h2 { margin:0; padding:16px 16px 8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:500; }
  .log { flex:1; overflow:auto; padding:4px 14px 8px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:90%; padding:8px 10px; font-size:12px; line-height:1.45; border:1px solid rgba(243,243,241,.2); }
  .you { margin-left:auto; }
  form { display:flex; gap:8px; padding:8px 12px 12px; border-top:1px solid rgba(243,243,241,.12); }
  input { flex:1; background:transparent; border:0; color:inherit; font-size:13px; padding:8px 0; outline:none; }
  form button { border:0; background:transparent; cursor:pointer; width:32px; height:32px; padding:0; }
  .dock {
    position:fixed; left:12px; right:12px; bottom:14px; z-index:9; height:52px;
    display:grid; grid-template-columns:repeat(4, 1fr); align-items:center;
    border:1px solid rgba(243,243,241,.28); border-radius:26px; background:rgba(12,12,12,.8);
    opacity:0; transform:translateY(12px); pointer-events:none; transition:.7s ease;
  }
  .dock.on { opacity:1; transform:none; pointer-events:auto; }
  .dock i { position:absolute; top:6px; bottom:6px; width:calc(25% - 8px); left:6px; border-radius:20px; background:rgba(243,243,241,.1); box-shadow:0 0 18px rgba(243,243,241,.08); transition:transform .35s ease; }
  .dock button { position:relative; z-index:1; border:0; background:transparent; color:#8d8d8d; font-size:10px; letter-spacing:.04em; cursor:pointer; }
  .dock button.on { color:#f3f3f1; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<div class="cross" id="cross"><i class="v"></i><i class="h"></i></div>
<div class="weed" id="weed" aria-hidden="true">
  <svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1">
    <circle cx="40" cy="40" r="18"/>
    <path d="M40 8 L40 72 M8 40 L72 40 M16 16 L64 64 M64 16 L16 64"/>
    <path d="M40 18 C52 28 52 52 40 62 C28 52 28 28 40 18"/>
  </svg>
</div>
<div class="leaves" id="leaves" aria-hidden="true">
  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor"><path d="M20 4 L24 16 L36 18 L26 26 L30 38 L20 30 L10 38 L14 26 L4 18 L16 16 Z"/></svg>
  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor"><path d="M20 4 L24 16 L36 18 L26 26 L30 38 L20 30 L10 38 L14 26 L4 18 L16 16 Z"/></svg>
  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor"><path d="M20 4 L24 16 L36 18 L26 26 L30 38 L20 30 L10 38 L14 26 L4 18 L16 16 Z"/></svg>
  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor"><path d="M20 4 L24 16 L36 18 L26 26 L30 38 L20 30 L10 38 L14 26 L4 18 L16 16 Z"/></svg>
  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor"><path d="M20 4 L24 16 L36 18 L26 26 L30 38 L20 30 L10 38 L14 26 L4 18 L16 16 Z"/></svg>
</div>

<section class="scene on" id="home">
  <div class="mark" id="mark">
    <img class="logo" id="logo" src="logo.png" alt="V³ studio" />
  </div>
  <button class="btn" id="start" type="button">дизайн для бизнеса<span class="glint"></span></button>
</section>
<section class="scene" id="film">
  <video id="vid" playsinline webkit-playsinline preload="auto" poster="frames/f01.jpg"><source src="ink.mp4" type="video/mp4" /></video>
  <div class="shade"></div>
  <div class="cross" id="film-cross"><i class="v"></i><i class="h"></i></div>
  <div class="cap" id="cap"><span id="phrase"></span></div>
</section>
<section class="scene" id="after">
  <div class="cipher" id="cipher"></div>
  <button class="btn" id="howBtn" type="button">как мы работаем<span class="glint"></span></button>
</section>
<section class="scene" id="how">
  <div class="steps"><p>1 слушаем</p><p>2 думаем</p><p>3 внедряем</p></div>
  <button class="btn" id="see" type="button">посмотреть<span class="glint"></span></button>
</section>
<section class="scene" id="gallery">
  <div class="gtop">примеры размышлений</div>
  <div class="rail" id="rail"></div>
  <div class="note"><div class="note-top"><h2 id="gtitle">жест</h2><button class="x" id="expand" type="button">+</button></div><div class="full" id="full">Кадр задаёт характер раньше слов.</div></div>
  <button class="btn discuss" id="discuss" type="button">обсудим?<span class="glint"></span></button>
  <div class="ducks" id="ducks" aria-hidden="true"><svg viewBox="0 0 180 36" fill="none" stroke="currentColor" stroke-width="1"><path d="M8 24 C14 16 22 16 26 22 L30 20 L34 16 L36 20 L30 24 Z"/><path d="M48 26 C54 20 60 20 64 25 L68 22 L71 18 L73 22 L66 26 Z"/><path d="M86 26 C91 21 96 21 100 26 L103 23 L106 20 L108 23 L101 27 Z"/><path d="M122 27 C126 22 131 22 134 27 L137 24 L140 21 L142 24 L135 28 Z"/><path d="M154 27 C158 23 162 23 165 27 L168 25 L170 22 L172 25 L166 28 Z"/></svg></div>
</section>
<section class="scene" id="shell">
  <div class="ticker"><div class="ticker-track" id="ticker"></div></div>
  <div class="stage"><div class="panel" id="panel"></div></div>
</section>
<nav class="dock" id="dock">
  <i id="pill"></i>
  <button type="button" data-tab="studio">о студии</button>
  <button type="button" data-tab="contacts">контакты</button>
  <button type="button" data-tab="cabinet">личный кабинет</button>
  <button type="button" data-tab="prices">тарифы</button>
</nav>
<svg class="cracks" id="cracks" hidden></svg>
<div class="dream" id="dream"><i></i><i></i><i></i><svg class="uni" viewBox="0 0 88 64" fill="none" stroke="#fff" stroke-width="1.4"><path d="M18 40 C24 28 34 26 42 32 L48 24 L52 30 L58 18 L60 32 L70 28 L66 40 C74 44 74 52 62 52 L24 52 C14 52 12 46 18 40Z"/><path d="M42 32 L40 16 L46 24 M48 24 L50 10"/></svg></div>
<script>
const vid = document.getElementById('vid');
vid.load();
const vLine = document.querySelector('#cross .v');
const hLine = document.querySelector('#cross .h');
const fv = document.querySelector('#film-cross .v');
const fh = document.querySelector('#film-cross .h');
function aim(px, py) {
  const r = document.getElementById('logo').getBoundingClientRect();
  vLine.style.left = (r.left + r.width * px) + 'px';
  hLine.style.top = (r.top + r.height * py) + 'px';
}
const start = document.getElementById('start');
setTimeout(() => {
  start.classList.add('show');
  aim(.38, .72);
  setTimeout(() => aim(.64, .80), 800);
  setTimeout(() => aim(.50, .20), 1600);
  setTimeout(() => aim(.86, .20), 2300);
  setTimeout(() => aim(.68, .13), 3000);
  setTimeout(() => start.classList.add('glint'), 2500);
  setTimeout(() => document.body.classList.add('dark'), 3400);
}, 600);
function showCube() {}
const scenes = ['home','film','after','how','gallery','shell'].map(id => document.getElementById(id));
function show(id) {
  scenes.forEach(s => s.classList.toggle('on', s.id === id));
  document.getElementById('dock').classList.toggle('on', id === 'shell');
  const cross = document.getElementById('cross');
  const frame = document.getElementById('frame');
  if (id === 'home') { cross.classList.remove('off'); frame.classList.remove('off'); }
  else if (id === 'film') { cross.classList.remove('off'); frame.classList.add('off'); }
  else { cross.classList.add('off'); frame.classList.add('off'); }
  document.getElementById('weed').classList.toggle('on', id === 'after');
  document.getElementById('leaves').classList.toggle('on', id === 'how');
  document.getElementById('ducks').classList.toggle('on', id === 'gallery');
}
const lines = [[0.4,'дизайн<br>который не равнодушен'],[3.8,'креативность<br>которая дышит'],[7.4,'эстетика<br>и функционал'],[11.2,'привлекает<br>внимание']];
const phrase = document.getElementById('phrase');
const cap = document.getElementById('cap');
let capKey = '';
let lineIndex = 0;
const focus = [[.16,.82],[.84,.16],[.9,.1],[.5,.5]];
start.addEventListener('click', openFilm);
start.addEventListener('touchend', (e) => { e.preventDefault(); openFilm(); }, { passive:false });
function openFilm() {
  show('film');
  vid.currentTime = 0;
  vid.muted = false;
  const p = vid.play();
  if (p) p.catch(() => { vid.muted = true; vid.play(); });
}
vid.ontimeupdate = () => {
  let html = '';
  let idx = 0;
  lines.forEach(([t, line], i) => { if (vid.currentTime >= t) { html = line; idx = i; } });
  if (html !== capKey) {
    capKey = html; lineIndex = idx;
    cap.classList.remove('on');
    setTimeout(() => { phrase.innerHTML = html; cap.classList.add('on'); aimPhrase(); }, 100);
  }
};
function aimPhrase() {
  const r = phrase.getBoundingClientRect();
  if (!r.width) return;
  const [px, py] = focus[lineIndex] || [.5,.5];
  fv.style.left = (r.left + r.width * px) + 'px';
  fh.style.top = (r.top + r.height * py) + 'px';
}
vid.onended = () => { cap.classList.remove('on'); show('after'); cipher(); };
function cipher() {
  const phrase = 'создание дизайна и решений для проектов';
  const box = document.getElementById('cipher');
  const chars = phrase.split('');
  const glyphs = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ';
  const open = chars.map(c => c === ' ');
  const draw = () => { box.textContent = chars.map((c,i) => c === ' ' || open[i] ? c : glyphs[Math.floor(Math.random()*glyphs.length)]).join(''); };
  draw();
  const timer = setInterval(() => {
    const closed = open.map((v,i) => !v && chars[i] !== ' ' ? i : -1).filter(i => i >= 0);
    if (!closed.length) { clearInterval(timer); box.textContent = phrase; document.getElementById('howBtn').classList.add('show'); return; }
    open[closed[Math.floor(Math.random()*closed.length)]] = true; draw();
  }, 36);
}
document.getElementById('howBtn').onclick = () => {
  show('how');
  document.querySelectorAll('#how .steps p').forEach((p,i) => setTimeout(() => p.classList.add('in'), 160 + i * 200));
  setTimeout(() => document.getElementById('see').classList.add('show'), 860);
};
document.getElementById('see').onclick = () => { show('gallery'); buildRail(); document.getElementById('discuss').classList.add('show'); };
const frames = [['frames/f01.jpg','жест','Плотность кадра раньше слов.'],['frames/f03.jpg','ход','Цвет как идея.'],['frames/f05.jpg','тепло','То, что запоминают раньше знака.'],['frames/f07.jpg','воздух','Без лишнего шума.'],['frames/f09.jpg','ясность','Следующий шаг.'],['frames/f11.jpg','пульс','Проект живой.']];
function buildRail() {
  const rail = document.getElementById('rail');
  if (rail.childElementCount) return;
  frames.forEach((f,i) => { const d = document.createElement('article'); d.className = 'card' + (i ? '' : ' focus hint'); d.innerHTML = '<img alt="" src="'+f[0]+'">'; d.dataset.title=f[1]; d.dataset.text=f[2]; rail.appendChild(d); });
  const cards = [...rail.children];
  rail.onscroll = () => {
    cards[0].classList.remove('hint');
    const mid = rail.scrollLeft + rail.clientWidth/2; let best=0, dist=1e9;
    cards.forEach((c,i) => { const dd = Math.abs(c.offsetLeft + c.offsetWidth/2 - mid); if (dd<dist){dist=dd; best=i;} });
    cards.forEach((c,i) => c.classList.toggle('focus', i===best));
    document.getElementById('gtitle').textContent = cards[best].dataset.title;
    document.getElementById('full').textContent = cards[best].dataset.text;
  };
}
document.getElementById('expand').onclick = () => { const full = document.getElementById('full'); full.classList.toggle('open'); document.getElementById('expand').textContent = full.classList.contains('open') ? '×' : '+'; };
const nets = [['Telegram','https://t.me/'],['Instagram','https://instagram.com/'],['YouTube','https://youtube.com/'],['VK','https://vk.com/'],['Pinterest','https://pinterest.com/'],['Behance','https://behance.net/'],['WhatsApp','https://wa.me/'],['Почта','mailto:hello@v3.studio']];
const row = nets.map(([n,h]) => '<a href="'+h+'" target="_blank" rel="noreferrer">'+n+'</a>').join('');
document.getElementById('ticker').innerHTML = row + row;
const first = 'Здравствуйте. Напишите, на какой стадии проект — мы не предлагаем, пока не услышим посыл.';
const panels = {
  studio: '<h2>что такое дизайн</h2><div class="trio"><button type="button" data-fx="aes">эстетика</button><button type="button" data-fx="idea">креатив</button><button type="button" data-fx="fx">эффект</button></div><div class="fx" id="fx"></div>',
  contacts: '<h2>диалог</h2><div class="log" id="log"></div><form id="form"><input id="msg" placeholder="сообщение" /><button type="submit" aria-label="отправить"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21 L23 12 L2 3 L2 10 L17 12 L2 14 Z"/></svg></button></form>',

  prices: '<h2>тарифы</h2><div class="log"><div class="bubble">Базовый старт — 15 000.</div><div class="bubble">Индивидуально — под бюджет, если проект нравится.</div></div>'
};
function typeInto(el, text) {
  el.textContent = '';
  let i = 0;
  const t = setInterval(() => { el.textContent += text[i++] || ''; if (i >= text.length) clearInterval(t); }, 28);
}
function tab(name) {
  document.getElementById('panel').innerHTML = panels[name];
  const buttons = [...document.querySelectorAll('#dock button')];
  buttons.forEach((b,i) => { const on = b.dataset.tab === name; b.classList.toggle('on', on); if (on) document.getElementById('pill').style.transform = 'translateX('+(i*100)+'%)'; });
  if (name === 'studio') bindFx();
  if (name === 'cabinet') {
    document.getElementById('login').onclick = () => note('Вход. Пока это каркас кабинета.');
    document.getElementById('reg').onclick = () => note('Регистрация. Сюда сядет аккаунт клиента.');
  }
  if (name === 'contacts') {
    const log = document.getElementById('log');
    const bubble = document.createElement('div'); bubble.className = 'bubble'; log.appendChild(bubble); typeInto(bubble, first);
    document.getElementById('form').onsubmit = (e) => {
      e.preventDefault();
      const v = document.getElementById('msg').value.trim(); if (!v) return;
      const you = document.createElement('div'); you.className = 'bubble you'; you.textContent = v; log.appendChild(you);
      document.getElementById('msg').value = '';
      setTimeout(() => { const us = document.createElement('div'); us.className = 'bubble'; log.appendChild(us); typeInto(us, 'Слышим. Если посыла нет — так и скажем.'); }, 240);
    };
  }
}
function note(text) {
  const log = document.getElementById('authlog');
  log.innerHTML = '<div class="bubble"></div>';
  log.firstChild.textContent = text;
}
function bindFx() {
  document.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => {
    const box = document.getElementById('fx');
    document.getElementById('dream').classList.remove('on');
    if (b.dataset.fx === 'aes') {
      box.innerHTML = '<div class="cube3"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="core" id="core"></div>';
      typeInto(document.getElementById('core'), 'внимание мелочам');
    } else if (b.dataset.fx === 'idea') {
      box.innerHTML = '<svg class="bulb on" width="72" height="96" viewBox="0 0 72 96" fill="none" stroke="currentColor"><path class="glass" d="M36 8 a22 22 0 0 1 12 40 c-4 6-6 10-6 16 H30 c0-6-2-10-6-16 A22 22 0 0 1 36 8z"/><path d="M30 70 h12 M32 76 h8 M34 82 h4"/></svg>';
    } else {
      box.innerHTML = '';
      const dream = document.getElementById('dream');
      dream.classList.add('on');
      setTimeout(() => dream.classList.remove('on'), 10000);
    }
  });
}
document.getElementById('discuss').onclick = () => { show('shell'); tab('contacts'); };
document.querySelectorAll('#dock button').forEach(b => b.onclick = () => tab(b.dataset.tab));
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('dblclick', e => e.preventDefault());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
